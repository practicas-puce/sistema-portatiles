<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LTIC Préstamos - Buscar Usuario</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-dark">
    <header class="navbar navbar-expand-lg navbar-dark bg-black shadow-sm">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1"
          >LTIC Préstamos - Consulta de Usuarios</span
        >
        <a href="/" class="btn btn-sm btn-outline-secondary"
          ><i class="bi bi-arrow-left"></i> Página Principal</a
        >
      </div>
    </header>

    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card shadow-sm mb-4">
            <div class="card-body p-4">
              <h2 class="card-title text-center mb-4 fs-4 text-secondary">
                Buscar por Identificación/Nombre
              </h2>

              <form id="busquedaForm">
                <div class="mb-3">
                  <label for="tipoBusqueda" class="form-label"
                    >Buscar por:</label
                  >
                  <select
                    class="form-select bg-white text-black border-secondary mb-3"
                    id="tipoBusqueda"
                  >
                    <option value="identificacion" selected>
                      Identificación
                    </option>
                    <option value="nombre">Nombre Completo</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label
                    for="terminoBusqueda"
                    class="form-label"
                    id="lblTerminoBusqueda"
                    >Número de Cédula o Pasaporte</label
                  >
                  <div class="input-group">
                    <input
                      type="text"
                      class="form-control"
                      id="terminoBusqueda"
                      placeholder="17XXXXXXXX"
                      required
                    />
                    <button type="submit" class="btn btn-primary">
                      Buscar
                    </button>
                  </div>
                </div>
              </form>

              <div id="mensajeNotificacion" class="mt-3"></div>
            </div>
          </div>

          <div id="listaResultadosCard" class="card shadow-sm d-none mb-4">
            <div class="card-header bg-black text-white text-center py-3">
              <h3 class="fs-5 mb-0">Resultados de la Búsqueda</h3>
            </div>
            <div class="card-body p-0">
              <div class="table-responsive">
                <table
                  class="table table-striped table-hover mb-0 align-middle"
                >
                  <thead class="table-dark">
                    <tr>
                      <th class="ps-3">Nombre</th>
                      <th>Identificación</th>
                      <th class="text-center">Acción</th>
                    </tr>
                  </thead>
                  <tbody id="cuerpoResultados"></tbody>
                </table>
              </div>
            </div>
          </div>

          <div id="resultadoCard" class="card shadow-sm d-none">
            <div class="card-header bg-black text-white text-center py-3">
              <h3 class="fs-5 mb-0" id="resNombre">Nombre del Usuario</h3>
            </div>
            <div class="card-body p-4 text-black bg-secondary bg-opacity-10">
              <p>
                <strong>Tipo Documento:</strong>
                <span id="resTipo" class="text-capitalize"></span>
              </p>
              <p>
                <strong>Identificación:</strong> <span id="resCedula"></span>
              </p>
              <p><strong>Celular:</strong> <span id="resCelular"></span></p>
              <p>
                <strong>Correo Electrónico:</strong>
                <span id="resCorreo"></span>
              </p>
              <p>
                <strong>Carrera asignada:</strong>
                <span id="resCarrera" class="text-info"></span>
              </p>
              <hr />
              <div class="form-check form-switch mt-3">
                <input
                  class="form-check-input"
                  type="checkbox"
                  role="switch"
                  id="switchRolUsuario"
                />
                <label
                  class="form-check-label fw-bold text-dark"
                  for="switchRolUsuario"
                  id="lblSwitchRolUsuario"
                  >Rol: Estudiante</label
                >
              </div>
              <div id="mensajeRolUpdate" class="mt-2 small"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("busquedaForm");
        const contenedorMensaje = document.getElementById(
          "mensajeNotificacion",
        );
        const resultadoCard = document.getElementById("resultadoCard");
        const listaResultadosCard = document.getElementById(
          "listaResultadosCard",
        );
        const cuerpoResultados = document.getElementById("cuerpoResultados");
        const tipoBusqueda = document.getElementById("tipoBusqueda");
        const lblTerminoBusqueda =
          document.getElementById("lblTerminoBusqueda");
        const inputTermino = document.getElementById("terminoBusqueda");

        const switchRolUsuario = document.getElementById("switchRolUsuario");
        const lblSwitchRolUsuario = document.getElementById(
          "lblSwitchRolUsuario",
        );
        const mensajeRolUpdate = document.getElementById("mensajeRolUpdate");

        let usuariosEncontrados = [];
        let usuarioDetalleId = null;

        // Cambiar etiquetas dinámicamente según el tipo de búsqueda
        tipoBusqueda.addEventListener("change", () => {
          if (tipoBusqueda.value === "identificacion") {
            lblTerminoBusqueda.textContent = "Número de Cédula o Pasaporte";
            inputTermino.placeholder = "17XXXXXXXX";
          } else {
            lblTerminoBusqueda.textContent = "Nombre del Usuario";
            inputTermino.placeholder = "Juan Pérez";
          }
        });

        // Manejar cambio de rol
        switchRolUsuario.addEventListener("change", async () => {
          if (usuarioDetalleId === null) return;

          switchRolUsuario.disabled = true;
          mensajeRolUpdate.innerHTML =
            '<span class="text-muted">Actualizando rol...</span>';

          const esAdmin = switchRolUsuario.checked;

          try {
            const response = await fetch("/api/usuarios/cambiar-rol", {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                usuario_id: parseInt(usuarioDetalleId),
                es_administrador: esAdmin,
              }),
            });

            const data = await response.json();

            if (response.ok) {
              lblSwitchRolUsuario.textContent = esAdmin
                ? "Rol: Encargado"
                : "Rol: Estudiante";
              mensajeRolUpdate.innerHTML =
                '<span class="text-success">✅ ¡Rol actualizado con éxito!</span>';

              // Actualizar en caché local
              const idx = usuariosEncontrados.findIndex(
                (u) => u.id === usuarioDetalleId,
              );
              if (idx !== -1) {
                usuariosEncontrados[idx].rol = esAdmin
                  ? "administrador"
                  : "comun";
              }
            } else {
              switchRolUsuario.checked = !esAdmin; // Revertir
              mensajeRolUpdate.innerHTML = `<span class="text-danger">❌ Error: ${data.error}</span>`;
            }
          } catch (err) {
            switchRolUsuario.checked = !esAdmin; // Revertir
            mensajeRolUpdate.innerHTML =
              '<span class="text-danger">❌ Error al conectar con el servidor.</span>';
          } finally {
            switchRolUsuario.disabled = false;
          }
        });

        // Función para mostrar los detalles de un usuario seleccionado
        window.mostrarDetallesUsuario = (index) => {
          const usuario = usuariosEncontrados[index];
          if (!usuario) return;

          usuarioDetalleId = usuario.id;
          mensajeRolUpdate.innerHTML = "";

          document.getElementById("resNombre").textContent =
            usuario.nombre_completo;
          document.getElementById("resTipo").textContent = usuario.tipo_id;
          document.getElementById("resCedula").textContent = usuario.numero_id;
          document.getElementById("resCelular").textContent = usuario.celular;
          document.getElementById("resCorreo").textContent = usuario.correo;
          document.getElementById("resCarrera").textContent =
            usuario.carrera || "Ninguna (Administrador)";

          // Set switch state based on role
          switchRolUsuario.checked = usuario.rol === "administrador";
          lblSwitchRolUsuario.textContent =
            usuario.rol === "administrador"
              ? "Rol: Encargado (Administrador)"
              : "Rol: Estudiante";

          resultadoCard.classList.remove("d-none");
        };

        form.addEventListener("submit", async (e) => {
          e.preventDefault();

          const termino = inputTermino.value.trim();
          const tipo = tipoBusqueda.value;

          contenedorMensaje.innerHTML = "";
          resultadoCard.classList.add("d-none");
          listaResultadosCard.classList.add("d-none");
          cuerpoResultados.innerHTML = "";
          usuariosEncontrados = [];

          try {
            let url = "";
            if (tipo === "identificacion") {
              url = `/api/usuarios/buscar?numero_id=${encodeURIComponent(termino)}`;
            } else {
              url = `/api/usuarios/buscar?nombre=${encodeURIComponent(termino)}`;
            }

            const response = await fetch(url);
            const resultado = await response.json();

            if (response.ok) {
              if (tipo === "identificacion") {
                // Para identificación, retorna un único objeto de usuario
                usuariosEncontrados = [resultado];
                mostrarDetallesUsuario(0);
              } else {
                // Para nombre, retorna un arreglo
                usuariosEncontrados = resultado;

                if (usuariosEncontrados.length === 0) {
                  contenedorMensaje.innerHTML = `
                    <div class="alert alert-warning border-0 shadow-sm mb-0" role="alert">
                      ⚠️ No se encontraron usuarios con ese nombre.
                    </div>
                  `;
                  return;
                }

                if (usuariosEncontrados.length === 1) {
                  mostrarDetallesUsuario(0);
                } else {
                  usuariosEncontrados.forEach((u, index) => {
                    cuerpoResultados.innerHTML += `
                      <tr>
                        <td class="ps-3 fw-medium">${u.nombre_completo}</td>
                        <td>${u.numero_id}</td>
                        <td class="text-center">
                          <button type="button" class="btn btn-sm btn-primary" onclick="mostrarDetallesUsuario(${index})">
                            Detalles
                          </button>
                        </td>
                      </tr>
                    `;
                  });
                  listaResultadosCard.classList.remove("d-none");
                }
              }
            } else {
              contenedorMensaje.innerHTML = `
                <div class="alert alert-danger border-0 shadow-sm mb-0" role="alert">
                  ❌ ${resultado.error || "Error al realizar la búsqueda."}
                </div>
              `;
            }
          } catch (error) {
            contenedorMensaje.innerHTML = `
              <div class="alert alert-danger border-0 shadow-sm mb-0" role="alert">
                ❌ Error crítico en la conexión con el servidor.
              </div>
            `;
          }
        });
      });
    </script>
  </body>
</html>
