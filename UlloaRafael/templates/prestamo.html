<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LTIC Préstamos - Registrar Préstamo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-dark">
    <header class="navbar navbar-expand-lg navbar-dark bg-black shadow-sm">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1"
          >LTIC Préstamos - Salida de Equipos</span
        >
        <a href="/" class="btn btn-sm btn-outline-secondary"
          ><i class="bi bi-arrow-left"></i> Página Principal</a
        >
      </div>
    </header>

    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h2 class="card-title text-center mb-4 fs-4 text-secondary">
                Nuevo Préstamo
              </h2>

              <form id="prestamoForm">
                <div class="mb-3">
                  <label for="usuario" class="form-label">Encargado</label>
                  <select class="form-select" id="usuario" required>
                    <option value="" selected disabled>
                      Seleccione el usuario...
                    </option>
                  </select>
                </div>

                <div class="mb-3">
                  <label for="usuario" class="form-label">Solicitante</label>
                  <select class="form-select" id="usuario" required>
                    <option value="" selected disabled>
                      Seleccione el usuario...
                    </option>
                  </select>
                </div>

                <div class="mb-3">
                  <label for="articulo" class="form-label"
                    >Equipo / Artículo Disponible</label
                  >
                  <select class="form-select" id="articulo" required>
                    <option value="" selected disabled>
                      Seleccione el equipo...
                    </option>
                  </select>
                </div>

                <div class="mb-4">
                  <label for="observaciones" class="form-label"
                    >Observaciones de Entrega</label
                  >
                  <textarea
                    class="form-control"
                    id="observaciones"
                    rows="3"
                    placeholder="Ej: Se entrega con cargador original, rasguño leve en la tapa trasera..."
                  ></textarea>
                </div>

                <div id="mensajeNotificacion" class="mb-3"></div>

                <div class="d-grid">
                  <button type="submit" class="btn btn-primary">
                    Confirmar Préstamo
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const selectUsuario = document.getElementById("usuario");
        const selectArticulo = document.getElementById("articulo");
        const form = document.getElementById("prestamoForm");
        const contenedorMensaje = document.getElementById(
          "mensajeNotificacion",
        );

        // 1. Cargar Usuarios y Artículos Disponibles al iniciar la pantalla
        try {
          // Obtener usuarios
          const resUsuarios = await fetch("/api/usuarios/lista");
          const usuarios = await resUsuarios.json();
          usuarios.forEach((u) => {
            selectUsuario.innerHTML += `<option value="${u.id}">${u.nombre_completo} (${u.numero_id})</option>`;
          });

          // Obtener artículos con estado 'disponible'
          const resArticulos = await fetch("/api/articulos/disponibles");
          const articulos = await resArticulos.json();
          articulos.forEach((a) => {
            selectArticulo.innerHTML += `<option value="${a.id}">${a.tipo_articulo} - ${a.modelo} [${a.codigo_activo}]</option>`;
          });
        } catch (err) {
          console.error("Error al poblar los selectores:", err);
        }

        // 2. Enviar el Préstamo al Servidor
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          contenedorMensaje.innerHTML = "";

          const datos = {
            usuario_id: parseInt(selectUsuario.value),
            articulo_id: parseInt(selectArticulo.value),
            fecha_devolucion_estimada:
              document.getElementById("fechaEstimada").value,
            observaciones: document
              .getElementById("observaciones")
              .value.trim(),
          };

          try {
            const response = await fetch("/api/prestamos", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(datos),
            });

            const resultado = await response.json();

            if (response.ok) {
              contenedorMensaje.innerHTML = `
                <div class="alert alert-success border-0 shadow-sm" role="alert">
                  ✅ ¡Préstamo registrado con éxito! El estado del equipo pasó a 'prestado'.
                </div>
              `;
              form.reset();

              // Removemos la opción del artículo prestado del select para que no se duplique
              const opcionRemover = selectArticulo.querySelector(
                `option[value="${datos.articulo_id}"]`,
              );
              if (opcionRemover) opcionRemover.remove();
            } else {
              contenedorMensaje.innerHTML = `
                <div class="alert alert-danger border-0 shadow-sm" role="alert">
                  ❌ Error: ${resultado.error}
                </div>
              `;
            }
          } catch (error) {
            contenedorMensaje.innerHTML = `
              <div class="alert alert-danger border-0 shadow-sm" role="alert">
                ❌ Error crítico de comunicación con el servidor.
              </div>
            `;
          }
        });
      });
    </script>
  </body>
</html>
