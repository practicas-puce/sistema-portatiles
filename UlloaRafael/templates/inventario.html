<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LTIC Préstamos - Inventario</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <style>
      .inventory-table {
        font-size: 0.95rem;
      }
      .badge-stock {
        padding: 0.5rem 0.75rem;
        font-size: 0.85rem;
      }
      .loading {
        display: none;
      }
    </style>
  </head>
  <body class="bg-dark">
    <header class="navbar navbar-expand-lg navbar-dark bg-black shadow-sm">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1"
          ><i class="bi bi-box-seam"></i> LTIC Préstamos - Inventario</span
        >
        <a href="/" class="btn btn-sm btn-outline-secondary"
          ><i class="bi bi-arrow-left"></i> Página Principal</a
        >
      </div>
    </header>

    <main class="container-lg my-5">
      <div class="row mb-4">
        <div class="col">
          <h2 class="text-white mb-2">Stock de Equipos</h2>
          <p class="text-secondary">
            Visualiza la disponibilidad actual de todos los equipos en inventario
          </p>
        </div>
      </div>

      <div id="loadingSpinner" class="loading text-center my-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
        <p class="text-secondary mt-3">Cargando inventario...</p>
      </div>

      <div id="tablaInventarioContenedor"></div>

      <div id="mensajeError" class="alert alert-danger d-none" role="alert">
        <i class="bi bi-exclamation-circle"></i> No se pudo cargar el inventario.
        Por favor, intenta nuevamente.
      </div>

      <div id="mensajeVacio" class="alert alert-info d-none" role="alert">
        <i class="bi bi-info-circle"></i> No hay artículos disponibles en el
        inventario.
      </div>
    </main>

    <footer class="text-center text-secondary my-4 small">LTIC 2026</footer>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        cargarInventario();
      });

      async function cargarInventario() {
        const loadingSpinner = document.getElementById("loadingSpinner");
        const tablaContenedor = document.getElementById(
          "tablaInventarioContenedor",
        );
        const mensajeError = document.getElementById("mensajeError");
        const mensajeVacio = document.getElementById("mensajeVacio");

        loadingSpinner.style.display = "block";
        mensajeError.classList.add("d-none");
        mensajeVacio.classList.add("d-none");
        tablaContenedor.innerHTML = "";

        try {
          const response = await fetch("/api/inventario");
          const datos = await response.json();

          loadingSpinner.style.display = "none";

          if (!response.ok) {
            throw new Error(datos.error || "Error al cargar el inventario");
          }

          if (!datos.inventario || datos.inventario.length === 0) {
            mensajeVacio.classList.remove("d-none");
            return;
          }

          // Construir tabla
          let html = '<div class="table-responsive">';
          html += '<table class="table table-dark table-hover inventory-table">';
          html += `
            <thead class="table-secondary text-dark">
              <tr>
                <th>Tipo de Artículo</th>
                <th>Modelo</th>
                <th class="text-center">Disponibles</th>
                <th class="text-center">Prestados</th>
                <th class="text-center">Total</th>
              </tr>
            </thead>
            <tbody>
          `;

          datos.inventario.forEach((item) => {
            const porcentajeDisponible = (
              (item.unidades_disponibles / item.total_inventario) *
              100
            ).toFixed(0);

            let badgeDisponible = "bg-success";
            if (porcentajeDisponible < 50) badgeDisponible = "bg-warning";
            if (porcentajeDisponible < 20) badgeDisponible = "bg-danger";

            html += `
              <tr>
                <td><span class="badge bg-info text-dark">${item.tipo_articulo}</span></td>
                <td class="text-secondary">${item.modelo}</td>
                <td class="text-center">
                  <span class="badge badge-stock ${badgeDisponible}">
                    ${item.unidades_disponibles}
                  </span>
                </td>
                <td class="text-center">
                  <span class="badge badge-stock bg-warning text-dark">
                    ${item.unidades_prestadas}
                  </span>
                </td>
                <td class="text-center">
                  <span class="badge badge-stock bg-secondary">
                    ${item.total_inventario}
                  </span>
                </td>
              </tr>
            `;
          });

          html += "</tbody></table></div>";
          tablaContenedor.innerHTML = html;
        } catch (error) {
          loadingSpinner.style.display = "none";
          console.error("Error:", error);
          mensajeError.classList.remove("d-none");
        }
      }
    </script>
  </body>
</html>
