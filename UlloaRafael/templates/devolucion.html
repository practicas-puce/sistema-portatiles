<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LTIC Préstamos - Devoluciones</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-dark">
    <header class="navbar navbar-expand-lg navbar-dark bg-black shadow-sm">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1"
          >LTIC Préstamos - Entrada de Inventario</span
        >
        <a href="/" class="btn btn-sm btn-outline-secondary"
          ><i class="bi bi-arrow-left"></i> Página Principal</a
        >
      </div>
    </header>

    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
          <div class="card shadow-sm mb-4">
            <div class="card-body p-4">
              <h2 class="card-title text-center mb-4 fs-4 text-secondary">
                Buscar Préstamos Activos
              </h2>
              <form id="buscarPrestamoForm">
                <div class="mb-3">
                  <label for="numeroID" class="form-label"
                    >Identificación del Usuario</label
                  >
                  <div class="input-group">
                    <input
                      type="text"
                      class="form-control"
                      id="numeroID"
                      placeholder="17XXXXXXXX"
                      required
                    />
                    <button type="submit" class="btn btn-success">
                      Buscar
                    </button>
                  </div>
                </div>
              </form>
              <div id="mensajeBusqueda" class="mt-3"></div>
            </div>
          </div>

          <div id="listaPrestamosCard" class="card shadow-sm d-none">
            <div class="card-header bg-black text-white text-center py-3">
              <h3 class="fs-5 mb-0">Equipos en Posesión</h3>
            </div>
            <div
              class="card-body p-4 bg-secondary bg-opacity-10 text-white"
              id="contenedorEquipos"
            ></div>
          </div>
        </div>
      </div>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const formBuscar = document.getElementById("buscarPrestamoForm");
        const mensajeBusqueda = document.getElementById("mensajeBusqueda");
        const listaPrestamosCard =
          document.getElementById("listaPrestamosCard");
        const contenedorEquipos = document.getElementById("contenedorEquipos");

        formBuscar.addEventListener("submit", async (e) => {
          e.preventDefault();
          const numeroId = document.getElementById("numeroID").value.trim();
          mensajeBusqueda.innerHTML = "";
          listaPrestamosCard.classList.add("d-none");
          contenedorEquipos.innerHTML = "";

          try {
            const res = await fetch(
              `/api/prestamos/activos?numero_id=${numeroId}`,
            );
            const prestamos = await res.json();

            if (res.ok && prestamos.length > 0) {
              prestamos.forEach((p) => {
                contenedorEquipos.innerHTML += `
                  <div class="border border-secondary p-3 rounded mb-3 bg-dark">
                    <p class="mb-1"><strong>Equipo:</strong> ${p.tipo_articulo} - ${p.modelo} [${p.codigo_activo}]</p>
                    <p class="mb-2 text-warning small"><strong>Fecha Límite Prevista:</strong> ${new Date(p.fecha_devolucion_prevista).toLocaleString()}</p>
                    <button class="btn btn-sm btn-success btn-devolver w-100" data-prestamo-id="${p.id}" data-articulo-id="${p.articulo_id}">
                      Procesar Entrada / Liberar
                    </button>
                  </div>
                `;
              });
              listaPrestamosCard.classList.remove("d-none");
            } else {
              mensajeBusqueda.innerHTML = `<div class="alert alert-danger border-0">${prestamos.error || "No registra deudas activas."}</div>`;
            }
          } catch (err) {
            mensajeBusqueda.innerHTML = `<div class="alert alert-danger border-0">❌ Error de conexión al consultar.</div>`;
          }
        });

        contenedorEquipos.addEventListener("click", async (e) => {
          if (e.target.classList.contains("btn-devolver")) {
            const boton = e.target;
            const prestamoId = boton.getAttribute("data-prestamo-id");
            const articuloId = boton.getAttribute("data-articulo-id");
            boton.disabled = true;

            try {
              const response = await fetch("/api/prestamos/devolver", {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  prestamo_id: parseInt(prestamoId),
                  articulo_id: parseInt(articuloId),
                }),
              });

              if (response.ok) {
                boton.parentElement.innerHTML = `<div class="alert alert-success border-0 py-2 mb-0">✅ Devolución guardada.</div>`;
                setTimeout(() => {
                  window.location.href = "/";
                }, 1500);
              } else {
                boton.disabled = false;
                alert("Error al guardar devolución.");
              }
            } catch (err) {
              boton.disabled = false;
            }
          }
        });
      });
    </script>
  </body>
</html>
