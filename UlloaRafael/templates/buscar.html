<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LTIC Préstamos - Buscar Usuario</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-dark">
    <header class="navbar navbar-expand-lg navbar-dark bg-black shadow-sm">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1"
          >LTIC Préstamos - Consulta de Usuarios</span
        >
        <a href="/" class="btn btn-sm btn-outline-secondary"
          ><i class="bi bi-arrow-left"></i> Página Principal</a
        >
      </div>
    </header>

    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card shadow-sm mb-4">
            <div class="card-body p-4">
              <h2 class="card-title text-center mb-4 fs-4 text-secondary">
                Buscar por Identificación
              </h2>

              <form id="busquedaForm">
                <div class="mb-3">
                  <label for="numeroID" class="form-label"
                    >Número de Cédula o Pasaporte</label
                  >
                  <div class="input-group">
                    <input
                      type="text"
                      class="form-control"
                      id="numeroID"
                      placeholder="17XXXXXXXX"
                      required
                    />
                    <button type="submit" class="btn btn-primary">
                      Buscar
                    </button>
                  </div>
                </div>
              </form>

              <div id="mensajeNotificacion" class="mt-3"></div>
            </div>
          </div>

          <div id="resultadoCard" class="card shadow-sm d-none">
            <div class="card-header bg-black text-white text-center py-3">
              <h3 class="fs-5 mb-0" id="resNombre">Nombre del Usuario</h3>
            </div>
            <div class="card-body p-4 text-black bg-secondary bg-opacity-10">
              <p>
                <strong>Tipo Documento:</strong>
                <span id="resTipo" class="text-capitalize"></span>
              </p>
              <p>
                <strong>Identificación:</strong> <span id="resCedula"></span>
              </p>
              <p><strong>Celular:</strong> <span id="resCelular"></span></p>
              <p>
                <strong>Correo Electrónico:</strong>
                <span id="resCorreo"></span>
              </p>
              <p>
                <strong>Carrera asignada:</strong>
                <span id="resCarrera" class="text-info"></span>
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("busquedaForm");
        const contenedorMensaje = document.getElementById(
          "mensajeNotificacion",
        );
        const resultadoCard = document.getElementById("resultadoCard");

        form.addEventListener("submit", async (e) => {
          e.preventDefault();

          const numeroId = document.getElementById("numeroID").value.trim();
          contenedorMensaje.innerHTML = "";
          resultadoCard.classList.add("d-none"); // Ocultar resultado anterior

          try {
            const response = await fetch(
              `/api/usuarios/buscar?numero_id=${numeroId}`,
            );
            const resultado = await response.json();

            if (response.ok) {
              // Poblar datos en la tarjeta de resultados
              document.getElementById("resNombre").textContent =
                resultado.nombre_completo;
              document.getElementById("resTipo").textContent =
                resultado.tipo_id;
              document.getElementById("resCedula").textContent =
                resultado.numero_id;
              document.getElementById("resCelular").textContent =
                resultado.celular;
              document.getElementById("resCorreo").textContent =
                resultado.correo;
              document.getElementById("resCarrera").textContent =
                resultado.carrera;

              // Mostrar la tarjeta quitando la clase de Bootstrap 'd-none'
              resultadoCard.classList.remove("d-none");
            } else {
              // Mensaje rojo si no se encuentra o hay error controlado
              contenedorMensaje.innerHTML = `
                <div class="alert alert-danger border-0 shadow-sm mb-0" role="alert">
                  ❌ ${resultado.error}
                </div>
              `;
            }
          } catch (error) {
            contenedorMensaje.innerHTML = `
              <div class="alert alert-danger border-0 shadow-sm mb-0" role="alert">
                ❌ Error crítico en la conexión con el servidor.
              </div>
            `;
          }
        });
      });
    </script>
  </body>
</html>
