<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LTIC Préstamos - Servicios</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <script>
      const obtenerTemaPreferido = () => {
        const temaGuardado = localStorage.getItem("theme");
        if (temaGuardado) return temaGuardado;
        return window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      };

      const aplicarTema = (tema) => {
        document.documentElement.setAttribute("data-bs-theme", tema);
        localStorage.setItem("theme", tema);

        const switchTema = document.getElementById("themeSwitch");
        const iconoTema = document.getElementById("themeIcon");

        if (switchTema && iconoTema) {
          if (tema === "dark") {
            switchTema.checked = true;
            iconoTema.className = "bi bi-moon-stars-fill text-warning";
          } else {
            switchTema.checked = false;
            iconoTema.className = "bi bi-sun-fill text-warning";
          }
        }
      };

      aplicarTema(obtenerTemaPreferido());

      document.addEventListener("DOMContentLoaded", () => {
        const switchTema = document.getElementById("themeSwitch");
        aplicarTema(obtenerTemaPreferido());
        if (switchTema) {
          switchTema.addEventListener("change", () => {
            aplicarTema(switchTema.checked ? "dark" : "light");
          });
        }
      });
    </script>
  </head>
  <body>
    <header class="navbar navbar-expand-lg navbar-dark bg-black shadow-sm">
      <div class="container-fluid">
        <a class="navbar-brand mb-0 h1 d-flex align-items-center" href="/">
          <img src="{{ url_for('static', filename='LogoLTICS.jpg.jpeg') }}" alt="Logo" height="30" class="d-inline-block align-middle me-2 rounded" />
          LTIC Préstamos - Registro
        </a>
        <div class="d-flex align-items-center gap-3 ms-auto">
          <div class="form-check form-switch" style="cursor: pointer">
            <input
              class="form-check-input"
              type="checkbox"
              id="themeSwitch"
              style="cursor: pointer"
            />
            <label class="form-check-label ms-1" for="themeSwitch">
              <i id="themeIcon" class="bi bi-moon-stars-fill text-warning"></i>
            </label>
          </div>
          <a href="/" class="btn btn-sm btn-light text-dark fw-bold shadow-sm"
            ><i class="bi bi-house-door-fill me-1"></i> Volver al Inicio</a
          >
        </div>
      </div>
    </header>

    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h2 class="card-title text-center mb-4 fs-4 text-secondary">
                Registro
              </h2>

              <form id="registroForm">
                <div class="mb-3">
                  <label for="carrera" class="form-label fw-semibold"
                    >Carrera</label
                  >
                  <div class="input-group">
                    <select class="form-select" id="carrera" required>
                      <option value="">Seleccione una carrera</option>
                    </select>
                    <button
                      type="button"
                      class="btn btn-outline-primary"
                      onclick="abrirModalNuevaCarrera()"
                    >
                      <i class="bi bi-plus-lg"></i>
                    </button>
                  </div>
                </div>

                <div class="mb-3">
                  <label for="tipoId" class="form-label fw-semibold"
                    >Tipo ID</label
                  >
                  <select class="form-select" id="tipoId" required>
                    <option value="" selected disabled>
                      Seleccione una opción
                    </option>
                    <option value="cedula">Cédula</option>
                    <option value="pasaporte">Pasaporte</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label for="numeroID" class="form-label fw-semibold"
                    >Identificación</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="numeroID"
                    maxlength="10"
                    placeholder="17XXXXXXXX"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="nombre" class="form-label fw-semibold"
                    >Nombre Completo</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="nombre"
                    placeholder="Nombre"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="celular" class="form-label fw-semibold"
                    >Celular</label
                  >
                  <input
                    type="tel"
                    class="form-control"
                    id="celular"
                    maxlength="10"
                    placeholder="0999999999"
                    required
                  />
                </div>

                <div class="mb-4">
                  <label for="correo" class="form-label fw-semibold"
                    >Correo Electrónico</label
                  >
                  <input
                    type="email"
                    class="form-control"
                    id="correo"
                    placeholder="ejemplo@correo.com"
                    required
                  />
                </div>

                <div id="mensajeNotificacion" class="mb-3"></div>

                <div class="d-grid">
                  <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- MODAL NUEVA CARRERA -->
    <div
      class="modal fade"
      id="modalNuevaCarrera"
      tabindex="-1"
      aria-labelledby="modalNuevaCarreraLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content shadow border-0">
          <div class="modal-header bg-black text-white">
            <h5 class="modal-title fw-bold fs-6" id="modalNuevaCarreraLabel">
              Nueva Carrera
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>
          <div class="modal-body">
            <div
              id="alertNuevaCarrera"
              class="alert alert-danger d-none py-2 small"
            ></div>
            <div class="mb-3">
              <label for="nuevaCarreraNombre" class="form-label fw-bold small"
                >Nombre de la Carrera:</label
              >
              <input
                type="text"
                class="form-control form-control-sm"
                id="nuevaCarreraNombre"
                placeholder="Ingrese una nueva carrera"
              />
            </div>
          </div>
          <div class="modal-footer text-end p-2 border-top">
            <button
              type="button"
              class="btn btn-sm btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>
            <button
              type="button"
              class="btn btn-sm btn-success fw-bold"
              onclick="guardarNuevaCarrera()"
            >
              Guardar
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      let selectCarrera;
      let form;
      let carreraModal = null;

      async function cargarCarrerasDropdown(selectedId = null) {
        try {
          const res = await fetch("/api/carreras");
          const carreras = await res.json();

          let opciones =
            '<option value="" selected disabled>Seleccione una carrera...</option>';
          carreras.forEach((c) => {
            opciones += `<option value="${c.id}">${c.nombre}</option>`;
          });
          selectCarrera.innerHTML = opciones;

          if (selectedId) {
            selectCarrera.value = selectedId;
          }
        } catch (err) {
          console.error("Error al cargar las carreras:", err);
        }
      }

      window.abrirModalNuevaCarrera = () => {
        document.getElementById("nuevaCarreraNombre").value = "";
        document.getElementById("alertNuevaCarrera").classList.add("d-none");
        if (!carreraModal) {
          carreraModal = new bootstrap.Modal(
            document.getElementById("modalNuevaCarrera"),
          );
        }
        carreraModal.show();
      };

      window.guardarNuevaCarrera = async () => {
        const nombre = document
          .getElementById("nuevaCarreraNombre")
          .value.trim();
        const alertDiv = document.getElementById("alertNuevaCarrera");
        alertDiv.classList.add("d-none");

        if (!nombre) {
          alertDiv.textContent =
            "El nombre de la carrera no puede estar vacío.";
          alertDiv.classList.remove("d-none");
          return;
        }

        try {
          const response = await fetch("/api/carreras", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nombre: nombre }),
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || "Error al guardar la carrera.");
          }

          // Recargar dropdown y seleccionar la nueva carrera
          await cargarCarrerasDropdown(data.id);
          carreraModal.hide();
        } catch (error) {
          alertDiv.textContent = error.message;
          alertDiv.classList.remove("d-none");
        }
      };

      document.addEventListener("DOMContentLoaded", async () => {
        selectCarrera = document.getElementById("carrera");
        form = document.getElementById("registroForm");

        await cargarCarrerasDropdown();

        // 2. Enviar Formulario al Backend
        form.addEventListener("submit", async (e) => {
          e.preventDefault();

          const contenedorMensaje = document.getElementById(
            "mensajeNotificacion",
          );
          contenedorMensaje.innerHTML = "";

          const datos = {
            tipo_id: document.getElementById("tipoId").value,
            numero_id: document.getElementById("numeroID").value,
            nombre_completo: document.getElementById("nombre").value,
            celular: document.getElementById("celular").value,
            correo: document.getElementById("correo").value,
            carrera_id: parseInt(selectCarrera.value),
          };

          try {
            const response = await fetch("/api/usuarios", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(datos),
            });

            const resultado = await response.json();

            if (response.ok) {
              contenedorMensaje.innerHTML = `
                <div class="alert alert-success border-0 shadow-sm" role="alert">
                  ✅ ¡Registro guardado con éxito!
                </div>
              `;
              form.reset(); // Resetea los campos de texto y vuelve el select a su opción por defecto

              setTimeout(() => {
                window.location.href = "/"; // Redirige a la página de inicio después de 2 segundos
              }, 2000);
            } else {
              contenedorMensaje.innerHTML = `
                <div class="alert alert-danger border-0 shadow-sm" role="alert">
                  ❌ Error: ${resultado.error}
                </div>
              `;
            }
          } catch (error) {
            contenedorMensaje.innerHTML = `
              <div class="alert alert-danger border-0 shadow-sm" role="alert">
                ❌ Error crítico en la conexión con el servidor.
              </div>
            `;
          }
        });
      });
    </script>
  </body>
</html>
