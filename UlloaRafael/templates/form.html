<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LTIC Préstamos - Servicios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-dark">

    <header class="navbar navbar-expand-lg navbar-dark bg-black shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">LTIC Préstamos - Servicios</span>
        </div>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="card-title text-center mb-4 fs-4 text-secondary">Registro</h2>
                        
                        <form>
                            <div class="mb-3">
                                <label for="carrera" class="form-label">Carrera</label>
                                <input type="text" class="form-control" id="carrera" placeholder="Ej. Ingeniería en Sistemas" required>
                            </div>

                            <div class="mb-3">
                                <label for="escuela" class="form-label">Escuela</label>
                                <input type="text" class="form-control" id="escuela" placeholder="Ej. Sistemas" required>
                            </div>

                            <div class="mb-3">
                                <label for="facultad" class="form-label">Facultad</label>
                                <input type="text" class="form-control" id="facultad" placeholder="Ej. Ingeniería" required>
                            </div>

                            <div class="mb-3">
                                <label for="tipoId" class="form-label">Tipo ID</label>
                                <select class="form-select" id="tipoId" required>
                                    <option value="" selected disabled>Seleccione una opción</option>
                                    <option value="cedula">Cédula</option>
                                    <option value="pasaporte">Pasaporte</option>
                                </select>
                            </div>
                                
                            <div class="mb-3">
                                <label for="numeroID" class="form-label">Identificación</label>
                                <input type="text" class="form-control" id="numeroID" placeholder="17XXXXXXXX" required>
                            </div>

                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre Completo</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Nombre..." required>
                            </div>

                            <div class="mb-3">
                                <label for="celular" class="form-label">Celular</label>
                                <input type="tel" class="form-control" id="celular" placeholder="0999999999" required>
                            </div>

                            <div class="mb-4">
                                <label for="correo" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="correo" placeholder="ejemplo@correo.com" required>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Guardar</button>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </main>
