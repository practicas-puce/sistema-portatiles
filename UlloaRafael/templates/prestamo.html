<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LTIC Préstamos - Registrar Préstamo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-dark">
    <header class="navbar navbar-expand-lg navbar-dark bg-black shadow-sm">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1"
          >LTIC Préstamos - Salida de Equipos</span
        >
        <a href="/" class="btn btn-sm btn-outline-secondary"
          ><i class="bi bi-arrow-left"></i> Página Principal</a
        >
      </div>
    </header>

    <main class="container my-5">
      <div class="row g-4 justify-content-center">
        <div class="col-lg-6">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h2 class="card-title text-center mb-4 fs-4 text-secondary">
                Datos del Préstamo
              </h2>

              <div class="mb-3">
                <label for="administrador" class="form-label">Encargado</label>
                <select
                  class="form-select bg-white text-black border-secondary"
                  id="administrador"
                  required
                >
                  <option value="" selected disabled>
                    Seleccione el encargado
                  </option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label"
                  >Buscar Solicitante (Cédula / ID)</label
                >
                <div class="input-group">
                  <input
                    type="text"
                    class="form-control bg-white text-black border-secondary"
                    id="searchCedula"
                    maxlength="10"
                    placeholder="17XXXXXXXX"
                  />
                  <button
                    type="button"
                    class="btn btn-primary"
                    id="btnBuscarSolicitante"
                  >
                    <i class="bi bi-search"></i>
                  </button>
                </div>
                <div id="solicitanteConfirmado" class="mt-2 d-none">
                  <div
                    class="alert alert-info py-2 px-3 mb-0 small border-0 bg-primary bg-opacity-10 text-primary-emphasis fw-medium"
                  >
                    <i class="bi bi-person-check-fill"></i> Solicitante:
                    <strong id="lblNombreSolicitante"></strong>
                  </div>
                </div>
              </div>

              <div class="mb-3">
                <label for="observaciones" class="form-label"
                  >Observaciones de Entrega</label
                >
                <textarea
                  class="form-control bg-white text-black border-secondary"
                  id="observaciones"
                  rows="2"
                  placeholder="Detalles de entrega"
                ></textarea>
              </div>
            </div>
          </div>
        </div>

        <div class="col-lg-5">
          <div class="card shadow-sm d-flex flex-column">
            <div class="card-body p-4 flex-grow-1">
              <h2 class="card-title text-center mb-4 fs-4 text-secondary">
                Resumen de Equipos
              </h2>

              <div class="mb-4">
                <label for="articulo" class="form-label"
                  >Seleccionar Artículo Disponible</label
                >
                <div class="input-group">
                  <select
                    class="form-select bg-white text-black border-secondary"
                    id="articulo"
                  >
                    <option value="" selected disabled>
                      Seleccione un equipo
                    </option>
                  </select>
                  <button
                    type="button"
                    class="btn btn-success"
                    id="btnAñadirAlCarrito"
                  >
                    <i class="bi bi-cart-plus"></i> Agregar
                  </button>
                </div>
              </div>

              <label
                class="form-label d-block border-bottom border-secondary pb-2"
                >Artículos a prestar:</label
              >
              <div id="carritoVacio" class="text-center text-muted py-4 small">
                El préstamo está vacío.
              </div>
              <ul
                class="list-group list-group-flush bg-transparent"
                id="listaCarrito"
              ></ul>
            </div>

            <div class="card-footer bg-transparent border-0 p-4 pt-0">
              <div id="mensajeNotificacion" class="mb-3"></div>
              <button
                type="button"
                class="btn btn-success w-100 py-2 fw-bold text-white"
                id="btnConfirmarPrestamo"
                disabled
              >
                <i class="bi bi-check-circle-fill"></i> Procesar Préstamo
                Completo
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const selectAdmin = document.getElementById("administrador");
        const selectArticulo = document.getElementById("articulo");
        const listaCarrito = document.getElementById("listaCarrito");
        const carritoVacio = document.getElementById("carritoVacio");
        const btnConfirmar = document.getElementById("btnConfirmarPrestamo");
        const contenedorMensaje = document.getElementById(
          "mensajeNotificacion",
        );


        let solicitanteId = null;
        let carrito = [];

        // 1. Cargar Administradores y Artículos Disponibles al iniciar
        try {
          const resUsuarios = await fetch("/api/usuarios/lista");
          const usuarios = await resUsuarios.json();
          usuarios.forEach((u) => {
            if (u.rol === "administrador") {
              selectAdmin.innerHTML += `<option value="${u.id}">${u.nombre_completo}</option>`;
            }
          });

          cargarArticulosDisponibles();
        } catch (err) {
          console.error("Error al iniciar la interfaz:", err);
        }

        async function cargarArticulosDisponibles() {
          selectArticulo.innerHTML =
            '<option value="" selected disabled>Seleccione un equipo...</option>';
          const resArticulos = await fetch("/api/articulos/disponibles");
          const articulos = await resArticulos.json();
          articulos.forEach((a) => {
            selectArticulo.innerHTML += `<option value="${a.id}" data-texto="${a.tipo_articulo} - ${a.modelo} [${a.codigo_activo}]">${a.tipo_articulo} - ${a.modelo} [${a.codigo_activo}]</option>`;
          });
        }

        // 2. Lógica del Buscador del Solicitante
        document
          .getElementById("btnBuscarSolicitante")
          .addEventListener("click", async () => {
            const cedula = document.getElementById("searchCedula").value.trim();
            const divConfirmacion = document.getElementById(
              "solicitanteConfirmado",
            );
            if (!cedula) return;

            try {
              const res = await fetch(
                `/api/usuarios/buscar?numero_id=${cedula}`,
              );
              const usuario = await res.json();

              if (res.ok) {
                solicitanteId = usuario.id;
                document.getElementById("lblNombreSolicitante").textContent =
                  usuario.nombre_completo;
                divConfirmacion.classList.remove("d-none");
                verificarFormularioValido();
              } else {
                solicitanteId = null;
                divConfirmacion.classList.add("d-none");
                alert("❌ " + (usuario.error || "Usuario no encontrado."));
              }
            } catch (err) {
              alert("Error al conectar con el servidor.");
            }
          });

        // 3. Agregar Elementos al Carrito
        document
          .getElementById("btnAñadirAlCarrito")
          .addEventListener("click", () => {
            const id = selectArticulo.value;
            if (!id) return;

            if (carrito.some((item) => item.id === id)) {
              alert("Este artículo ya está en el carrito.");
              return;
            }

            const opcionSeleccionada =
              selectArticulo.options[selectArticulo.selectedIndex];
            const texto = opcionSeleccionada.getAttribute("data-texto");

            carrito.push({ id: parseInt(id), texto: texto });
            opcionSeleccionada.remove();

            renderizarCarrito();
          });

        // 4. Eliminar Elementos del Carrito
        window.removerDelCarrito = (id) => {
          carrito = carrito.filter((item) => item.id !== id);
          renderizarCarrito();
          cargarArticulosDisponibles();
        };

        function renderizarCarrito() {
          listaCarrito.innerHTML = "";
          if (carrito.length === 0) {
            carritoVacio.classList.remove("d-none");
          } else {
            carritoVacio.classList.add("d-none");
            carrito.forEach((item) => {
              // El elemento del carrito se renderiza como una pequeña pastilla oscura para no sobrecargar el fondo de la tarjeta
              listaCarrito.innerHTML += `
                <li class="list-group-item bg-dark border-secondary text-white d-flex justify-content-between align-items-center mb-2 rounded p-2">
                  <span class="small"><i class="bi bi-laptop text-primary me-2"></i>${item.texto}</span>
                  <button type="button" class="btn btn-sm btn-outline-danger border-0" onclick="removerDelCarrito(${item.id})">
                    <i class="bi bi-trash3-fill"></i>
                  </button>
                </li>
              `;
            });
          }
          verificarFormularioValido();
        }

        function verificarFormularioValido() {
          const adminOk = selectAdmin.value ? true : false;
          const solicitanteOk = solicitanteId ? true : false;
          const carritoOk = carrito.length > 0;

          // Esto imprimirá en la consola F12 de tu navegador qué campo falta por completarse
          console.log("=== Estado de Validación ===");
          console.log(
            "1. Administrador seleccionado:",
            adminOk,
            "-> Valor:",
            selectAdmin.value,
          );
          console.log(
            "2. Solicitante verificado:",
            solicitanteOk,
            "-> ID:",
            solicitanteId,
          );
          console.log(
            "3. Carrito con artículos:",
            carritoOk,
            "-> Cantidad:",
            carrito.length,
          );

          // FORZADO TEMPORAL: Cambia esto a false para obligar al botón a prenderse si quieres probar el envío directo
          btnConfirmar.disabled = !(
            solicitanteId &&
            carrito.length > 0 &&
            selectAdmin.value
          );
        }

        selectAdmin.addEventListener("change", verificarFormularioValido);

        // 5. Procesar Préstamo Completo
        // 5. Procesar Préstamo Completo
        btnConfirmar.addEventListener("click", async () => {
          btnConfirmar.disabled = true;
          contenedorMensaje.innerHTML = "";

          // CORREGIDO: Sintaxis limpia de JavaScript sin declaraciones de tipo inválidas
          const datos = {
            usuario_id: parseInt(solicitanteId),
            administrador_id: parseInt(selectAdmin.value),
            observaciones: document
              .getElementById("observaciones")
              .value.trim(),
            articulos: carrito.map((item) => parseInt(item.id)),
          };

          try {
            const response = await fetch("/api/prestamos", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(datos),
            });

            const resultado = await response.json();

            if (response.ok) {
              contenedorMensaje.innerHTML = `<div class="alert alert-success border-0 shadow-sm">✅ Préstamo guardado. Redirigiendo...</div>`;
              setTimeout(() => {
                window.location.href = "/";
              }, 2500);
            } else {
              btnConfirmar.disabled = false;
              contenedorMensaje.innerHTML = `<div class="alert alert-danger border-0 shadow-sm">❌ Error: ${resultado.error}</div>`;
            }
          } catch (error) {
            btnConfirmar.disabled = false;
            contenedorMensaje.innerHTML = `<div class="alert alert-danger border-0 shadow-sm">❌ Error crítico en el servidor.</div>`;
          }
        });
      });
    </script>
  </body>
</html>
