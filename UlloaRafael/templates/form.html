<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LTIC Préstamos - Servicios</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-dark">
    <header class="navbar navbar-expand-lg navbar-dark bg-black shadow-sm">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1"
          ></i>LTIC Préstamos -
          Registro</span
        >
      </div>
    </header>

    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h2 class="card-title text-center mb-4 fs-4 text-secondary">
                Registro
              </h2>

              <form id="registroForm">
                <div class="mb-3">
                  <label for="facultad" class="form-label">Facultad</label>
                  <select class="form-select" id="facultad" required>
                    <option value="" selected disabled>
                      Seleccione una facultad...
                    </option>
                  </select>
                </div>

                <div class="mb-3">
                  <label for="escuela" class="form-label">Escuela</label>
                  <select class="form-select" id="escuela" required disabled>
                    <option value="" selected disabled>
                      Primero seleccione una facultad
                    </option>
                  </select>
                </div>

                <div class="mb-3">
                  <label for="carrera" class="form-label">Carrera</label>
                  <select class="form-select" id="carrera" required disabled>
                    <option value="" selected disabled>
                      Primero seleccione una escuela
                    </option>
                  </select>
                </div>

                <div class="mb-3">
                  <label for="tipoId" class="form-label">Tipo ID</label>
                  <select class="form-select" id="tipoId" required>
                    <option value="" selected disabled>
                      Seleccione una opción
                    </option>
                    <option value="cédula">Cédula</option>
                    <option value="pasaporte">Pasaporte</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label for="numeroID" class="form-label"
                    >Identificación</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="numeroID"
                    placeholder="17XXXXXXXX"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="nombre" class="form-label">Nombre Completo</label>
                  <input
                    type="text"
                    class="form-control"
                    id="nombre"
                    placeholder="Nombre..."
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="celular" class="form-label">Celular</label>
                  <input
                    type="tel"
                    class="form-control"
                    id="celular"
                    placeholder="0999999999"
                    required
                  />
                </div>

                <div class="mb-4">
                  <label for="correo" class="form-label"
                    >Correo Electrónico</label
                  >
                  <input
                    type="email"
                    class="form-control"
                    id="correo"
                    placeholder="ejemplo@correo.com"
                    required
                  />
                </div>

                <div id="mensajeNotificacion" class="mb-3"></div>

                <div class="d-grid">
                  <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const selectFacultad = document.getElementById("facultad");
        const selectEscuela = document.getElementById("escuela");
        const selectCarrera = document.getElementById("carrera");
        const form = document.getElementById("registroForm");

        // Cargar Facultades al iniciar la página
        try {
          const res = await fetch("/api/facultades");
          const facultades = await res.json();
          facultades.forEach((f) => {
            selectFacultad.innerHTML += `<option value="${f.id}">${f.nombre}</option>`;
          });
        } catch (err) {
          console.error("Error cargando facultades:", err);
        }

        // Evento al cambiar Facultad
        selectFacultad.addEventListener("change", async (e) => {
          const fId = e.target.value;
          selectEscuela.innerHTML =
            '<option value="" selected disabled>Seleccione una escuela...</option>';
          selectCarrera.innerHTML =
            '<option value="" selected disabled>Primero seleccione una escuela</option>';
          selectCarrera.disabled = true;

          if (!fId) return;
          const res = await fetch(`/api/escuelas?facultad_id=${fId}`);
          const escuelas = await res.json();
          escuelas.forEach((es) => {
            selectEscuela.innerHTML += `<option value="${es.id}">${es.nombre}</option>`;
          });
          selectEscuela.disabled = false;
        });

        // Evento al cambiar Escuela
        selectEscuela.addEventListener("change", async (e) => {
          const esId = e.target.value;
          selectCarrera.innerHTML =
            '<option value="" selected disabled>Seleccione una carrera...</option>';

          if (!esId) return;
          const res = await fetch(`/api/carreras?escuela_id=${esId}`);
          const carreras = await res.json();
          carreras.forEach((c) => {
            selectCarrera.innerHTML += `<option value="${c.id}">${c.nombre}</option>`;
          });
          selectCarrera.disabled = false;
        });

        // Enviar Formulario al Backend
        form.addEventListener("submit", async (e) => {
          e.preventDefault();

          const contenedorMensaje = document.getElementById(
            "mensajeNotificacion",
          );
          contenedorMensaje.innerHTML = "";

          const datos = {
            tipo_id: document.getElementById("tipoId").value,
            numero_id: document.getElementById("numeroID").value,
            nombre_completo: document.getElementById("nombre").value,
            celular: document.getElementById("celular").value,
            correo: document.getElementById("correo").value,
            carrera_id: parseInt(selectCarrera.value),
          };

          try {
            const response = await fetch("/api/usuarios", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(datos),
            });

            const resultado = await response.json();

            if (response.ok) {
              contenedorMensaje.innerHTML = `
                        <div class="alert alert-success border-0 shadow-sm" role="alert">
                        ✅ ¡Registro guardado con éxito!
                        </div>
                    `;
              form.reset();
              selectEscuela.disabled = true;
              selectCarrera.disabled = true;
            } else {
              contenedorMensaje.innerHTML = `
                        <div class="alert alert-danger border-0 shadow-sm" role="alert">
                        ❌ Error: ${resultado.error}
                        </div>
                    `;
            }
          } catch (error) {
            contenedorMensaje.innerHTML = `
                    <div class="alert alert-danger border-0 shadow-sm" role="alert">
                        ❌ Error crítico en la conexión con el servidor.
                    </div>
                `;
          }
        });
      });
    </script>
  </body>
</html>
