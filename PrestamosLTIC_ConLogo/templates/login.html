<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LTIC Préstamos - Iniciar Sesión</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <script>
      const obtenerTemaPreferido = () => {
        const temaGuardado = localStorage.getItem("theme");
        if (temaGuardado) return temaGuardado;
        return window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      };

      const aplicarTema = (tema) => {
        document.documentElement.setAttribute("data-bs-theme", tema);
        localStorage.setItem("theme", tema);
      };

      aplicarTema(obtenerTemaPreferido());
    </script>
      <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='LogoLTICS.jpg.jpeg') }}">
</head>
  <body class="d-flex flex-column min-vh-100 bg-body-tertiary">
    <header class="navbar navbar-expand-lg navbar-dark bg-black shadow-sm">
      <div class="container-fluid">
        <a class="navbar-brand mb-0 h1 d-flex align-items-center" href="/">
          <img src="{{ url_for('static', filename='LogoLTICS.jpg.jpeg') }}" alt="Logo" height="30" class="d-inline-block align-middle me-2 rounded" />
          LTIC Préstamos
        </a>
        <div class="d-flex align-items-center gap-3 ms-auto">
          <div class="form-check form-switch" style="cursor: pointer;">
            <input class="form-check-input" type="checkbox" id="themeSwitch" style="cursor: pointer;">
            <label class="form-check-label ms-1" for="themeSwitch">
              <i id="themeIcon" class="bi bi-moon-stars-fill text-warning"></i>
            </label>
          </div>
          <a href="/" class="btn btn-sm btn-light text-dark fw-bold shadow-sm">
            <i class="bi bi-house-door-fill me-1"></i>Inicio
          </a>
        </div>
      </div>
    </header>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center my-4">
      <div class="container" style="max-width: 420px">
        <div class="card shadow-lg border-0 rounded-3 p-4">
          <div class="card-body">
          <div class="text-center mb-4">
            <div class="mb-3">
              <img src="{{ url_for('static', filename='LogoLTICS.jpg.jpeg') }}" alt="Logo LTIC" height="60" class="rounded shadow-sm">
            </div>
            <h1 class="h3 fw-bold mb-1">Acceso Administrador</h1>
            <p class="text-secondary small">Gestión de Inventario LTIC</p>
          </div>

          <div
            id="loginAlert"
            class="alert alert-danger d-none"
            role="alert"
          ></div>

          <form id="loginForm">
            <div class="mb-3">
              <label for="username" class="form-label fw-semibold"
                >Usuario:</label
              >
              <div class="input-group">
                <span class="input-group-text"
                  ><i class="bi bi-person"></i
                ></span>
                <input
                  type="text"
                  class="form-control"
                  id="username"
                  placeholder="Ingrese el usuario"
                  required
                />
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label fw-semibold"
                >Contraseña:</label
              >
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-key"></i></span>
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  placeholder="••••••••"
                  required
                />
              </div>
            </div>

            <button
              type="submit"
              class="btn btn-primary w-100 py-2 fw-bold"
              id="btnLoginSubmit"
            >
              <span
                class="spinner-border spinner-border-sm d-none me-2"
                role="status"
                aria-hidden="true"
              ></span>
              Iniciar Sesión
            </button>
          </form>

          <div class="text-center mt-4">
            <a
              href="/"
              class="btn btn-link btn-sm text-secondary text-decoration-none"
            >
              Volver al Inicio
            </a>
          </div>
        </div>
      </div>
    </div>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("loginForm");
        const alertDiv = document.getElementById("loginAlert");
        const submitBtn = document.getElementById("btnLoginSubmit");
        const spinner = submitBtn.querySelector(".spinner-border");

        // Configuración de tema
        const switchTema = document.getElementById("themeSwitch");
        const temaIcono = document.getElementById("themeIcon");

        const actualizarIconoTema = (tema) => {
          if (!temaIcono) return;
          if (tema === "dark") {
            temaIcono.className = "bi bi-sun-fill text-warning";
          } else {
            temaIcono.className = "bi bi-moon-stars-fill text-warning";
          }
        };

        const temaActual = obtenerTemaPreferido();
        if (switchTema) {
          switchTema.checked = temaActual === "dark";
          actualizarIconoTema(temaActual);

          switchTema.addEventListener("change", () => {
            const nuevoTema = switchTema.checked ? "dark" : "light";
            aplicarTema(nuevoTema);
            actualizarIconoTema(nuevoTema);
          });
        }

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          alertDiv.classList.add("d-none");
          submitBtn.disabled = true;
          spinner.classList.remove("d-none");

          const username = document.getElementById("username").value.trim();
          const password = document.getElementById("password").value;

          try {
            const response = await fetch("/api/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username, password }),
            });

            const data = await response.json();

            if (!response.ok) {
              throw new Error(data.error || "Error de inicio de sesión.");
            }

            // Redirigir a inventario
            window.location.href = "/inventario";
          } catch (error) {
            alertDiv.textContent = error.message;
            alertDiv.classList.remove("d-none");
            submitBtn.disabled = false;
            spinner.classList.add("d-none");
          }
        });
      });
    </script>
  </body>
</html>
