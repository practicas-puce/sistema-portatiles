<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LTIC Préstamos - Servicios</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-dark">
    <header class="navbar navbar-expand-lg navbar-dark bg-black shadow-sm">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1"
          >LTIC Préstamos - Registro</span
        >
        <a href="/" class="btn btn-sm btn-light text-dark fw-bold shadow-sm"
          ><i class="bi bi-house-door-fill me-1"></i> Volver al Inicio</a
        >
      </div>
    </header>

    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h2 class="card-title text-center mb-4 fs-4 text-secondary">
                Registro
              </h2>

              <form id="registroForm">
                <div class="mb-3">
                  <label for="carrera" class="form-label fw-semibold">Carrera</label>
                  <select class="form-select" id="carrera" required>
                    <option value="">
                      Seleccione una carrera</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label for="tipoId" class="form-label fw-semibold">Tipo ID</label>
                  <select class="form-select" id="tipoId" required>
                    <option value="" selected disabled>
                      Seleccione una opción
                    </option>
                    <option value="cedula">Cédula</option>
                    <option value="pasaporte">Pasaporte</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label for="numeroID" class="form-label fw-semibold"
                    >Identificación</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="numeroID"
                    maxlength="10"
                    placeholder="17XXXXXXXX"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="nombre" class="form-label fw-semibold">Nombre Completo</label>
                  <input
                    type="text"
                    class="form-control"
                    id="nombre"
                    placeholder="Nombre"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="celular" class="form-label fw-semibold">Celular</label>
                  <input
                    type="tel"
                    class="form-control"
                    id="celular"
                    maxlength="10"
                    placeholder="0999999999"
                    required
                  />
                </div>

                <div class="mb-4">
                  <label for="correo" class="form-label fw-semibold"
                    >Correo Electrónico</label
                  >
                  <input
                    type="email"
                    class="form-control"
                    id="correo"
                    placeholder="ejemplo@correo.com"
                    required
                  />
                </div>

                <div id="mensajeNotificacion" class="mb-3"></div>

                <div class="d-grid">
                  <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const selectCarrera = document.getElementById("carrera");
        const form = document.getElementById("registroForm");

        // 1. Cargar la lista completa de carreras al iniciar la página
        try {
          const res = await fetch("/api/carreras");
          const carreras = await res.json();
          
          let opciones = '<option value="" selected disabled>Seleccione una carrera...</option>';
          carreras.forEach((c) => {
            opciones += `<option value="${c.id}">${c.nombre}</option>`;
          });
          selectCarrera.innerHTML = opciones;
        } catch (err) {
          console.error("Error al cargar las carreras:", err);
        }

        // 2. Enviar Formulario al Backend
        form.addEventListener("submit", async (e) => {
          e.preventDefault();

          const contenedorMensaje = document.getElementById("mensajeNotificacion");
          contenedorMensaje.innerHTML = "";

          const datos = {
            tipo_id: document.getElementById("tipoId").value,
            numero_id: document.getElementById("numeroID").value,
            nombre_completo: document.getElementById("nombre").value,
            celular: document.getElementById("celular").value,
            correo: document.getElementById("correo").value,
            carrera_id: parseInt(selectCarrera.value),
          };

          try {
            const response = await fetch("/api/usuarios", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(datos),
            });

            const resultado = await response.json();

            if (response.ok) {
              contenedorMensaje.innerHTML = `
                <div class="alert alert-success border-0 shadow-sm" role="alert">
                  ✅ ¡Registro guardado con éxito!
                </div>
              `;
              form.reset(); // Resetea los campos de texto y vuelve el select a su opción por defecto

              setTimeout(() => {
                window.location.href = "/"; // Redirige a la página de inicio después de 2 segundos
              }, 2000);
            } else {
              contenedorMensaje.innerHTML = `
                <div class="alert alert-danger border-0 shadow-sm" role="alert">
                  ❌ Error: ${resultado.error}
                </div>
              `;
            }
          } catch (error) {
            contenedorMensaje.innerHTML = `
              <div class="alert alert-danger border-0 shadow-sm" role="alert">
                ❌ Error crítico en la conexión con el servidor.
              </div>
            `;
          }
        });
      });
    </script>
    
  </body>
</html>
